[main]
font=JetbrainsMono:size=14

[colors-dark]
alpha=0.7
background=1a1a1a
foreground=e5e5e5

# Selection and cursor highlights
selection-background=404040
selection-foreground=ffffff

# Vibrant ANSI Colors for text readability
regular0=262626  # Black
regular1=ff6b6b  # Red (Vibrant Coral)
regular2=4eed88  # Green (Neon Mint)
regular3=ffd43b  # Yellow (Warm Amber)
regular4=3bc9db  # Blue (Electric Cyan)
regular5=da77f2  # Magenta (Bright Orchid)
regular6=22d3ee  # Cyan (Sky Blue)
regular7=e5e5e5  # White

# Bright variants for bold/highlighted text
bright0=4d4d4d   # Bright Black
bright1=fa5252   # Bright Red
bright2=12b886   # Bright Green
bright3=fab005   # Bright Yellow
bright4=15aabf   # Bright Blue
bright5=be4bdb   # Bright Magenta
bright6=06b6d4   # Bright Cyan
bright7=ffffff   # Bright White
